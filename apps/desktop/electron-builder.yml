appId: io.github.pratikdev.pgsketch
productName: pgsketch
directories:
  buildResources: build
  output: dist
# the renderer and preload are bundled into out/, and so are core and the dev tooling: only the
# runtime dependencies of the main process (see package.json) go in beside them
files:
  - out/**
  - package.json
# the licence texts go beside the program: the project's own, and the one the font asks to travel with it
extraFiles:
  - from: ../../LICENSE
    to: LICENSE
  - from: node_modules/@fontsource-variable/geist/LICENSE
    to: OFL.txt
linux:
  target:
    - deb
  executableName: pgsketch
  icon: build/icons
  # the name the window has on the desktop (package.json `desktopName`), so a running window is
  # matched to its menu entry
  syncDesktopName: true
  category: Development;Database;
  desktop:
    entry:
      Keywords: postgres;postgresql;schema;sql;migration;
artifactName: pgsketch_${version}_${arch}.${ext}
deb:
  # electron-builder's own list, plus the sound library Electron links against, which a desktop
  # system has and a clean one (a container, a server with a forwarded display) does not. The
  # renamed package comes first: on Ubuntu 24.04 `libasound2` is only a name that a stub can take
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
win:
  # without this the executable gets Electron's own icon: electron-builder only looks at the icon it is told of
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: pgsketch_${version}_x64_setup.${ext}
nsis:
  # per user, so it installs without an administrator prompt, like `apt remove` it keeps the
  # saved connections and drafts, and the person can pick the folder
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
